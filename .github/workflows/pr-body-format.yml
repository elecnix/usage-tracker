# Flags a pull-request description that will render badly on GitHub: prose
# hard-wrapped mid-sentence, list items broken onto a second line, collapsed
# tables, and mermaid diagrams the mermaid parser rejects.
#
# Deliberately advisory: the check goes red without blocking the merge, so the
# author reads the finding and fixes or dismisses it.
name: pr-body-format

on:
  pull_request:
    branches: [main]
    # `edited` re-runs the check once the author fixes the body — without it the
    # original red result stands.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-body-format:
    runs-on: ubuntu-latest
    steps:
      # No actions/checkout is needed: the body is read through the API. The
      # prose half of the check reads the repository's own .vale.ini out of a
      # checkout and is skipped, out loud, while there is none.
      - uses: elecnix/gh-pr-body-action@08c74dc0736abe295e90d6363abd55cf7ea63ef3  # v1.2.1
